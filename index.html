<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#171F26;
    --paper-alt:#1D262E;
    --card:#212B33;
    --ink:#ECEFF1;
    --ink-soft:#8D9BA6;
    --teal:#57B3AA;
    --teal-dark:#3E8A83;
    --teal-tint:rgba(87,179,170,.16);
    --alert:#E2685C;
    --alert-tint:rgba(226,104,92,.16);
    --amber:#E0A458;
    --amber-tint:rgba(224,164,88,.16);
    --success:#6FC38B;
    --success-tint:rgba(111,195,139,.16);
    --line:#33414A;
    --white:#0F1519;
    --teal-light:#83D2C8;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--teal);color:#0F1519;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}

  /* HEADER */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:12px;
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .brand .logo{height:40px;width:auto;display:block;}
  header.top .brand .brand-text{display:flex;flex-direction:column;gap:2px;}
  header.top .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--teal);font-weight:600;
  }
  header.top h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em;font-family:'Space Grotesk',sans-serif;}
  .quick-actions{display:flex;gap:8px;flex-wrap:wrap;}
  button.btn{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13.5px;
    border:1.5px solid var(--ink);background:var(--white);color:var(--ink);
    padding:9px 14px;border-radius:3px;cursor:pointer;transition:.12s;
    display:inline-flex;align-items:center;gap:6px;
  }
  button.btn:hover{background:var(--ink);color:var(--white);}
  button.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--white);}
  button.btn.primary:hover{background:var(--teal-light);border-color:var(--teal-light);}
  button.btn.ghost{border-color:var(--line);color:var(--ink-soft);background:transparent;}
  button.btn.ghost:hover{background:var(--paper-alt);color:var(--ink);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn.danger:hover{background:var(--alert);border-color:var(--alert);color:#fff;}

  /* TABS */
  nav.tabs{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  nav.tabs button{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;
    background:none;border:none;padding:10px 4px;margin-right:22px;
    color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;
    position:relative;top:1px;
  }
  nav.tabs button .n{color:var(--teal);margin-right:6px;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--teal);}

  /* WEEK RULER (signature element) */
  .ruler{
    display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;
    margin-bottom:22px;background:var(--card);
  }
  .ruler .day{
    flex:1;min-width:0;padding:10px 8px 12px;border-right:1px solid var(--line);
    position:relative;
  }
  .ruler .day:last-child{border-right:none;}
  .ruler .day.today{background:var(--teal-tint);}
  .ruler .day .dname{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .ruler .day.today .dname{color:var(--teal);font-weight:700;}
  .ruler .day .dnum{font-size:19px;font-weight:700;margin-top:1px;}
  .ruler .day .tick{
    margin-top:8px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;
    display:flex;
  }
  .ruler .day .tick .fill{height:100%;background:var(--amber);}
  .ruler .day .tick .fill.over{background:var(--alert);}
  .ruler .day .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:5px;}

  /* SECTION HEADINGS */
  h2.section-title{
    font-size:13px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-soft);margin:26px 0 12px;
    display:flex;align-items:center;gap:10px;
  }
  h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  /* STAT ROW */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px;}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:5px;padding:14px 16px;
  }
  .stat .val{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .stat.alert .val{color:var(--alert);}
  .stat.amber .val{color:var(--amber);}
  .stat.teal .val{color:var(--teal);}

  /* ALERT LIST */
  .alert-item{
    display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--line);border-left:4px solid var(--alert);
    border-radius:0 4px 4px 0;padding:10px 14px;margin-bottom:8px;
  }
  .alert-item.warn{border-left-color:var(--amber);}
  .alert-item .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--white);
    background:var(--teal);padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap;}
  .alert-item .txt{flex:1;font-size:13.5px;}
  .alert-item .txt b{font-weight:600;}
  .alert-item .due{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--alert);white-space:nowrap;}
  .alert-item.warn .due{color:var(--amber);}
  .empty{
    border:1.5px dashed var(--line);border-radius:6px;padding:26px 20px;text-align:center;
    color:var(--ink-soft);font-size:13.5px;
  }
  .empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px;}

  /* CONTRACT CARDS */
  .contracts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .contract-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
    cursor:pointer;transition:.12s;position:relative;
  }
  .contract-card:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(0,0,0,.3);}
  .contract-card .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);font-weight:700;}
  .contract-card h3{margin:4px 0 2px;font-size:15.5px;font-family:'Space Grotesk',sans-serif;font-weight:600;}
  .contract-card .client{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .contract-card .risk{color:var(--alert);font-size:11px;font-weight:700;margin-left:6px;}
  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;
  }
  .badge.andamento{background:var(--teal-tint);color:var(--teal);}
  .badge.aguardando{background:var(--amber-tint);color:var(--amber);}
  .badge.concluido{background:var(--success-tint);color:var(--success);}
  .badge.pausado{background:rgba(141,155,166,.16);color:var(--ink-soft);}
  .contract-card .meta-row{
    display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;
  }
  .contract-card .next-del{font-size:12.5px;margin-top:2px;}
  .contract-card .next-del b{font-weight:600;}

  /* MODAL / DETAIL PANEL */
  .overlay{
    position:fixed;inset:0;background:rgba(27,36,48,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .panel{
    background:var(--card);border-radius:8px;max-width:620px;width:100%;
    border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h3{margin:0;font-size:16.5px;}
  .panel-body{padding:18px 20px;}
  .panel-body label{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);margin:12px 0 5px;
  }
  .panel-body label:first-child{margin-top:0;}
  .panel-body input, .panel-body select, .panel-body textarea{
    width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;padding:8px 10px;
    border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);
  }
  .panel-body textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .panel-foot{
    padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;
  }
  .iconbtn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);line-height:1;}
  .iconbtn:hover{color:var(--ink);}

  /* CONTRACT DETAIL */
  .detail-info{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px;margin-bottom:6px;}
  .detail-info .k{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  .task-list{margin-top:10px;}
  .task-row{
    display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);
  }
  .task-row .chk{
    width:19px;height:19px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:#0F1519;
    font-weight:800;
  }
  .task-row .chk.done{background:var(--success);border-color:var(--success);}
  .task-row .chk.done::after{content:"✓";}
  .task-row .chk.doing{border-color:var(--amber);background:var(--amber-tint);}
  .task-row .chk.doing::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .task-row .ttl{flex:1;font-size:13.5px;}
  .task-row.done .ttl{text-decoration:line-through;color:var(--ink-soft);}
  .task-row .assignee{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--paper-alt);
    padding:2px 6px;border-radius:3px;color:var(--ink-soft);white-space:nowrap;
  }
  .task-row .due{font-family:'IBM Plex Mono',monospace;font-size:11.5px;white-space:nowrap;}
  .task-row .due.over{color:var(--alert);font-weight:600;}
  .task-row .del{color:var(--ink-soft);background:none;border:none;cursor:pointer;font-size:15px;}
  .task-row .del:hover{color:var(--alert);}
  .prio-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .prio-alta{background:var(--alert);} .prio-media{background:var(--amber);} .prio-baixa{background:var(--success);}

  /* WEEK VIEW */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .week-col{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:140px;}
  .week-col.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}
  .week-col .whead{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;
  }
  .week-col .whead b{display:block;font-size:15px;color:var(--ink);font-family:'IBM Plex Sans';}
  .chip{
    background:var(--paper-alt);border-radius:4px;padding:6px 8px;margin-bottom:6px;font-size:12px;
    border-left:3px solid var(--teal);cursor:pointer;
  }
  .chip.p-alta{border-left-color:var(--alert);}
  .chip.p-media{border-left-color:var(--amber);}
  .chip.p-baixa{border-left-color:var(--success);}
  .chip .ccode{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--teal);font-weight:700;}
  .chip .cttl{margin-top:2px;}
  .chip .cass{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .overdue-banner{
    background:var(--alert-tint);border:1px solid var(--alert);border-radius:6px;padding:12px 14px;margin-bottom:16px;
  }
  .overdue-banner .title{font-weight:700;color:var(--alert);font-size:13px;margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}

  /* TEAM VIEW */
  .team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .team-col{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;}
  .team-col .thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .team-col .thead input{
    font-size:15px;font-weight:700;border:none;background:none;padding:2px 0;width:70%;
    border-bottom:1px dashed transparent;
  }
  .team-col .thead input:focus{outline:none;border-bottom-color:var(--teal);}
  .team-col .thead .load{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--teal-tint);color:var(--teal);
    padding:2px 7px;border-radius:10px;font-weight:700;
  }
  .team-col .thead-actions{display:flex;align-items:center;gap:6px;}
  .team-col .removeperson{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;}
  .team-col .removeperson:hover{color:var(--alert);}
  .add-person-card{
    border:1.5px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;
    min-height:120px;cursor:pointer;color:var(--ink-soft);font-size:13.5px;font-weight:600;
  }
  .add-person-card:hover{border-color:var(--teal);color:var(--teal);}
  .hours-tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--paper-alt);
    padding:2px 6px;border-radius:3px;white-space:nowrap;
  }
  .meas-tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;cursor:pointer;
    padding:3px 7px;border-radius:3px;
  }
  .meas-tag.done{background:var(--success-tint);color:var(--success);}
  .meas-pending-row{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--amber);
    border-left:4px solid var(--amber);border-radius:0 4px 4px 0;padding:9px 12px;margin-bottom:8px;font-size:13px;
  }
  .meas-pending-row .txt{flex:1;}
  .meas-table{width:100%;border-collapse:collapse;font-size:13px;}
  .meas-table th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 10px;
  }
  .meas-table td{padding:9px 10px;border-bottom:1px solid var(--paper-alt);}
  .meas-table tr:hover td{background:var(--paper-alt);}
  .meas-table input[type="date"]{
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 6px;border:1px solid var(--line);
    border-radius:3px;background:var(--paper);color:var(--ink);
  }
  .month-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .month-nav .label{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;min-width:170px;text-align:center;}
  .month-nav button{
    background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:4px;
    width:30px;height:30px;cursor:pointer;font-size:14px;
  }
  .month-nav button:hover{border-color:var(--teal);color:var(--teal);}
  .month-nav .today-btn{width:auto;padding:0 10px;font-size:12px;font-family:'IBM Plex Mono',monospace;}

  select.status-select{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 6px;border-radius:3px;border:1px solid var(--line);}

  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .week-grid{grid-template-columns:repeat(1,1fr);}
    .team-grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .detail-info{grid-template-columns:1fr;}
  }
</style>
</head>

const DAY_MS = 86400000;
const STATUS_LABEL = {andamento:'Em andamento', aguardando:'Aguardando', concluido:'Concluído', pausado:'Pausado'};
const PRIO_LABEL = {alta:'Alta', media:'Média', baixa:'Baixa'};
const TIPO_CONFIG = {
  novo:            { label:'Projeto novo',            medicao:true  },
  alteracao_orc:   { label:'Alteração com orçamento', medicao:true  },
  alteracao_obra:  { label:'Alteração de obra',       medicao:false },
  rad:             { label:'RAD',                     medicao:false },
};
function tipoLabel(k){ return TIPO_CONFIG[k] ? TIPO_CONFIG[k].label : '—'; }
function tipoContaMedicao(k){ return !!(TIPO_CONFIG[k] && TIPO_CONFIG[k].medicao); }

function monthOffsetDate(offset){
  const d = new Date(); d.setDate(1); d.setHours(0,0,0,0);
  d.setMonth(d.getMonth()+offset);
  return d;
}
function monthRange(offset){
  const d = monthOffsetDate(offset);
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
  const label = d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  return { start: toISO(start), end: toISO(end), label: label.charAt(0).toUpperCase()+label.slice(1) };
}

let state = { contracts: [], tasks: [], team: [
  {id:'t1', name:'Pessoa 1'}, {id:'t2', name:'Pessoa 2'}, {id:'t3', name:'Pessoa 3'}
], settings: { email: '' } };
let ui = { tab:'overview', openContract:null, modal:null, loaded:false, weekOffset:0, measureMonthOffset:0, teamMonthOffset:0 };

function ensureShape(){
  if(!state.settings) state.settings = { email:'' };
  if(!Array.isArray(state.team)) state.team = [];
  if(!Array.isArray(state.tasks)) state.tasks = [];
  if(!Array.isArray(state.contracts)) state.contracts = [];
  state.tasks.forEach(t=>{
    if(t.tipoProjeto===undefined) t.tipoProjeto = null;
    if(t.tipoProjeto==='alteracao') t.tipoProjeto = 'alteracao_obra';
    if(t.revisado===undefined) t.revisado = false;
    if(t.dataProtocolo===undefined) t.dataProtocolo = null;
    if(t.concludedDate===undefined) t.concludedDate = null;
  });
}

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function parseDate(s){ if(!s) return null; const d = new Date(s+'T00:00:00'); return d; }
function fmtShort(s){ if(!s) return '—'; const d=parseDate(s); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function daysDiff(dateStr){ const d=parseDate(dateStr); const t=parseDate(todayStr()); return Math.round((d-t)/DAY_MS); }
function nextContractCode(){
  const nums = state.contracts.map(c=>parseInt((c.code||'SAN-00').split('-')[1])||0);
  const n = (nums.length? Math.max(...nums):0)+1;
  return 'SAN-' + String(n).padStart(2,'0');
}

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ /* primeiro uso, ainda sem dados salvos */ }
  ensureShape();
  ui.loaded = true;
  render();
}
async function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Erro ao salvar', e); alert('Não foi possível salvar. Verifique o espaço do navegador.'); }
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url; a.download = `painel-semanal-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.contracts || !parsed.tasks || !parsed.team) throw new Error('formato inválido');
      if(!confirm('Isso vai substituir todos os dados atuais pelo backup importado. Continuar?')) return;
      state = parsed;
      ensureShape();
      await save();
      ui.modal = null;
      render();
    }catch(err){
      alert('Arquivo de backup inválido ou corrompido.');
    }
  };
  reader.readAsText(file);
}

function csvEscape(v){
  const s = (v==null?'':String(v));
  if(/[",;\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportWeeklyReport(){
  const days = weekDates(0);
  const weekStart = toISO(days[0]);
  const weekEnd = toISO(days[6]);
  const relevant = state.tasks.filter(t=>
    (t.concludedDate && t.concludedDate>=weekStart && t.concludedDate<=weekEnd) ||
    (t.due && t.due>=weekStart && t.due<=weekEnd)
  );
  const rows = [['Colaborador','Contrato','Cliente','Tarefa','Prioridade','Prazo','Status','Concluída em','Horas gastas']];
  state.team.forEach(person=>{
    relevant.filter(t=>t.assignee===person.id).forEach(t=>{
      const c = contractById(t.contractId);
      rows.push([
        person.name, c?c.code+' - '+c.name:'—', c?c.client||'':'', t.title,
        PRIO_LABEL[t.priority]||t.priority, fmtShort(t.due), STATUS_LABEL[t.status]||t.status,
        t.concludedDate? fmtShort(t.concludedDate) : '', t.horas!=null? t.horas : ''
      ]);
    });
  });
  const semAssignee = relevant.filter(t=>!t.assignee || !teamById(t.assignee));
  semAssignee.forEach(t=>{
    const c = contractById(t.contractId);
    rows.push(['Sem responsável', c?c.code+' - '+c.name:'—', c?c.client||'':'', t.title,
      PRIO_LABEL[t.priority]||t.priority, fmtShort(t.due), STATUS_LABEL[t.status]||t.status,
      t.concludedDate? fmtShort(t.concludedDate) : '', t.horas!=null? t.horas : '']);
  });
  const csv = '\ufeff' + rows.map(r=>r.map(csvEscape).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `relatorio-semanal-${weekStart}-a-${weekEnd}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportMeasurement(){
  const range = monthRange(ui.measureMonthOffset);
  const inMonth = state.tasks.filter(t=>t.revisado && t.dataProtocolo && t.dataProtocolo>=range.start && t.dataProtocolo<=range.end)
    .sort((a,b)=> (a.dataProtocolo<b.dataProtocolo?-1:1));
  const rows = [['Contrato','Cliente','Tipo de projeto','Data de protocolo','Tarefa','Responsável','Horas gastas']];
  inMonth.forEach(t=>{
    const c = contractById(t.contractId);
    rows.push([
      c?c.code+' — '+c.name:'—', c?c.client||'':'', tipoLabel(t.tipoProjeto),
      fmtShort(t.dataProtocolo), t.title, teamById(t.assignee)?.name||'—', t.horas!=null?t.horas:''
    ]);
  });
  const csv = '\ufeff' + rows.map(r=>r.map(csvEscape).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `medicao-${range.start.slice(0,7)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportMonthlyTeamReport(){
  const range = monthRange(ui.teamMonthOffset);
  const done = state.tasks.filter(t=>t.status==='concluido' && t.concludedDate && t.concludedDate>=range.start && t.concludedDate<=range.end);
  const rows = [['RESUMO — '+range.label]];
  rows.push(['Colaborador','Tarefas concluídas','Horas totais','Média h/tarefa']);
  state.team.forEach(person=>{
    const mine = done.filter(t=>t.assignee===person.id);
    const totalH = mine.reduce((s,t)=> s + (t.horas||0), 0);
    const withH = mine.filter(t=>t.horas!=null).length;
    rows.push([person.name, mine.length, totalH || '', withH? (totalH/withH).toFixed(1) : '']);
  });
  rows.push([]);
  rows.push(['DETALHE']);
  rows.push(['Colaborador','Contrato','Tarefa','Tipo de projeto','Prioridade','Concluída em','Horas gastas']);
  state.team.forEach(person=>{
    done.filter(t=>t.assignee===person.id).forEach(t=>{
      const c = contractById(t.contractId);
      rows.push([person.name, c?c.code+' — '+c.name:'—', t.title, t.tipoProjeto?tipoLabel(t.tipoProjeto):'—',
        PRIO_LABEL[t.priority]||t.priority, fmtShort(t.concludedDate), t.horas!=null?t.horas:'']);
    });
  });
  const csv = '\ufeff' + rows.map(r=>r.map(csvEscape).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `relatorio-equipe-${range.start.slice(0,7)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function sendEmailAlert(){
  const email = (state.settings.email||'').trim();
  if(!email){ alert('Informe seu e-mail no campo acima antes de gerar o alerta.'); return; }
  const overdue = overdueTasks();
  const deliveries = upcomingDeliverables(7);
  const measurements = upcomingMeasurements(7);
  let body = `Resumo da semana (${fmtShort(todayStr())}):\n\n`;
  body += `ATRASADAS (${overdue.length}):\n`;
  body += overdue.length? overdue.map(t=>`- [${contractById(t.contractId)?.code||'—'}] ${t.title} (${teamById(t.assignee)?.name||'sem responsável'}) — venceu ${fmtShort(t.due)}`).join('\n') : '- nenhuma';
  body += `\n\nENTREGAS PRÓXIMOS 7 DIAS (${deliveries.length}):\n`;
  body += deliveries.length? deliveries.map(c=>`- [${c.code}] ${c.nextDeliverable||'entrega'} — ${fmtShort(c.deliverableDate)}`).join('\n') : '- nenhuma';
  body += `\n\nMEDIÇÕES PRÓXIMOS 7 DIAS (${measurements.length}):\n`;
  body += measurements.length? measurements.map(c=>`- [${c.code}] medição prevista — ${fmtShort(c.measurementDate)}`).join('\n') : '- nenhuma';
  const subject = encodeURIComponent(`Painel Semanal — Alertas de ${fmtShort(todayStr())}`);
  const mailto = `mailto:${encodeURIComponent(email)}?subject=${subject}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

function weekDates(offset=0){
  const t = parseDate(todayStr());
  const dow = (t.getDay()+6)%7; // 0=Mon
  const monday = new Date(t.getTime() - dow*DAY_MS + offset*7*DAY_MS);
  return Array.from({length:7}, (_,i)=> new Date(monday.getTime()+i*DAY_MS));
}
function toISO(d){ return d.toISOString().slice(0,10); }

function openTasksFor(contractId){
  return state.tasks.filter(t=>t.contractId===contractId);
}
function contractById(id){ return state.contracts.find(c=>c.id===id); }
function teamById(id){ return state.team.find(t=>t.id===id); }

function overdueTasks(){
  const ts = todayStr();
  return state.tasks.filter(t=>t.status!=='concluido' && t.due && t.due < ts)
    .sort((a,b)=> a.due<b.due?-1:1);
}
function upcomingDeliverables(days=7){
  const ts = todayStr();
  return state.contracts.filter(c=>c.deliverableDate && c.status!=='concluido')
    .map(c=>({...c, diff: daysDiff(c.deliverableDate)}))
    .filter(c=> c.diff!==null && c.diff>=0 && c.diff<=days)
    .sort((a,b)=>a.diff-b.diff);
}
function upcomingMeasurements(days=7){
  const ts = todayStr();
  return state.contracts.filter(c=>c.measurementDate)
    .map(c=>({...c, diff: daysDiff(c.measurementDate)}))
    .filter(c=> c.diff!==null && c.diff>=0 && c.diff<=days)
    .sort((a,b)=>a.diff-b.diff);
}
function overdueCountFor(contractId){
  const ts = todayStr();
  return state.tasks.filter(t=>t.contractId===contractId && t.status!=='concluido' && t.due && t.due<ts).length;
}

/* ---------- RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  if(!ui.loaded){ app.innerHTML = '<div style="padding:60px;text-align:center;color:#5B6673;">Carregando painel…</div>'; return; }

  app.innerHTML = `
    ${renderHeader()}
    ${renderTabs()}
    ${ui.tab==='overview' ? renderOverview() : ''}
    ${ui.tab==='contracts' ? renderContracts() : ''}
    ${ui.tab==='week' ? renderWeek() : ''}
    ${ui.tab==='team' ? renderTeam() : ''}
    ${ui.tab==='measure' ? renderMeasure() : ''}
    ${ui.modal ? renderModal() : ''}
  `;
  attachEvents();
}

function renderHeader(){
  return `
  <header class="top">
    <div class="brand">
      <img class="logo" src="data:image/png;base64,${LOGO_B64}" alt="VTX Engenharia">

        <h1>Painel Semanal</h1>
      </div>
    </div>
    <div class="quick-actions">
      <button class="btn ghost small" data-act="export-backup" title="Baixar backup em .json">⤓ Backup</button>
      <button class="btn ghost small" data-act="import-backup" title="Restaurar de um backup .json">⤒ Importar</button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      <button class="btn ghost small" data-act="new-contract">+ Contrato</button>

function renderTabs(){
  const tabs = [
    ['overview','01','Visão geral'],
    ['contracts','02','Contratos'],
    ['week','03','Semana'],
    ['measure','04','Medições'],
    ['team','05','Equipe'],
  ];
  return `<nav class="tabs">${tabs.map(([id,n,label])=>
    `<button class="${ui.tab===id?'active':''}" data-tab="${id}"><span class="n">${n}</span>${label}</button>`
  ).join('')}</nav>`;
}

function renderRuler(){
  const days = weekDates(0);
  const ts = todayStr();
  return `<div class="ruler">${days.map(d=>{
    const iso = toISO(d);
    const isToday = iso===ts;
    const dayTasks = state.tasks.filter(t=>t.due===iso);
    const overCount = dayTasks.filter(t=>t.status!=='concluido' && iso<ts).length;
    const total = dayTasks.length;
    const fillPct = total? Math.min(100, total*22) : 0;
    return `<div class="day ${isToday?'today':''}">
      <div class="dname">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</div>
      <div class="dnum">${d.getDate()}</div>
      <div class="tick"><div class="fill ${overCount?'over':''}" style="width:${fillPct}%"></div></div>
      <div class="count">${total} tarefa${total===1?'':'s'}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderOverview(){
  const overdue = overdueTasks();
  const ts = todayStr();
  const dueThisWeek = state.tasks.filter(t=>t.status!=='concluido' && t.due && t.due>=ts && daysDiff(t.due)<=7);
  const deliveries = upcomingDeliverables(7);
  const measurements = upcomingMeasurements(7);
  const activeContracts = state.contracts.filter(c=>c.status==='andamento').length;

  const alertItems = [
    ...overdue.map(t=>({kind:'alert', code: contractById(t.contractId)?.code || '—', text:`<b>${t.title}</b> — ${teamById(t.assignee)?.name||'sem responsável'}`, due:`${Math.abs(daysDiff(t.due))}d atrasada`})),
    ...deliveries.map(c=>({kind:'warn', code:c.code, text:`Entrega: <b>${c.nextDeliverable||'entrega'}</b>`, due: c.diff===0?'hoje':`em ${c.diff}d`})),
    ...measurements.map(c=>({kind:'warn', code:c.code, text:`Medição prevista`, due: c.diff===0?'hoje':`em ${c.diff}d`})),
  ];

  return `
    <h2 class="section-title">Esta semana</h2>
    ${renderRuler()}

    <div class="stats">
      <div class="stat teal"><div class="val">${activeContracts}</div><div class="lbl">Contratos em andamento</div></div>
      <div class="stat alert"><div class="val">${overdue.length}</div><div class="lbl">Tarefas atrasadas</div></div>
      <div class="stat amber"><div class="val">${dueThisWeek.length}</div><div class="lbl">Tarefas até 7 dias</div></div>
      <div class="stat"><div class="val">${measurements.length}</div><div class="lbl">Medições próximas</div></div>
    </div>

    <h2 class="section-title">Alertas</h2>
    ${alertItems.length===0 ? `
      <div class="empty"><b>Nada pendente no radar.</b>Sem atrasos ou prazos próximos. Bom momento para planejar a semana seguinte.</div>
    ` : alertItems.map(a=>`
      <div class="alert-item ${a.kind==='warn'?'warn':''}">
        <span class="code">${a.code}</span>
        <span class="txt">${a.text}</span>
        <span class="due">${a.due}</span>
      </div>
    `).join('')}
  `;
}

function renderContracts(){
  if(state.contracts.length===0){
    return `<h2 class="section-title">Contratos</h2>

  }
  return `
    <h2 class="section-title">Contratos (${state.contracts.length})</h2>
    <div class="contracts-grid">
      ${state.contracts.map(c=>{
        const tasks = openTasksFor(c.id);
        const openCount = tasks.filter(t=>t.status!=='concluido').length;
        const diff = c.deliverableDate ? daysDiff(c.deliverableDate) : null;
        const overCount = overdueCountFor(c.id);
        return `<div class="contract-card" data-open="${c.id}">
          <span class="code">${c.code}</span>${overCount>0?`<span class="risk">⚠ ${overCount} atrasada${overCount===1?'':'s'}</span>`:''}
          <h3>${c.name}</h3>
          <div class="client">${c.client||'—'}</div>
          <span class="badge ${c.status}">${STATUS_LABEL[c.status]}</span>
          ${c.nextDeliverable ? `<div class="next-del">Próxima entrega: <b>${c.nextDeliverable}</b>${c.deliverableDate ? ' · '+fmtShort(c.deliverableDate)+(diff!==null?` (${diff<0?'atrasada':diff===0?'hoje':diff+'d'})`:'') : ''}</div>` : ''}

            <span>${openCount} tarefa${openCount===1?'':'s'} aberta${openCount===1?'':'s'}</span>
            <span>${tasks.length} total</span>

function renderWeek(){
  const days = weekDates(ui.weekOffset);
  const ts = todayStr();
  const overdue = overdueTasks();
  const rangeLabel = `${days[0].getDate()} ${days[0].toLocaleDateString('pt-BR',{month:'short'}).replace('.','')} – ${days[6].getDate()} ${days[6].toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}`;
  return `
    <div class="month-nav">
      <button data-week-nav="-1">‹</button>
      <span class="label" style="font-size:14px;text-transform:capitalize;">${rangeLabel}</span>
      <button data-week-nav="1">›</button>
      ${ui.weekOffset!==0 ? `<button class="today-btn" data-week-nav="today">Hoje</button>` : ''}
    </div>

    ${overdue.length? `
      <div class="overdue-banner">
        <div class="title">Atrasadas (${overdue.length})</div>
        ${overdue.map(t=>`
          <div class="task-row" data-task="${t.id}">
            <div class="chk ${t.status==='concluido'?'done':t.status==='andamento'?'doing':''}" data-toggle="${t.id}"></div>
            <span class="prio-dot prio-${t.priority}"></span>
            <span class="ttl">[${contractById(t.contractId)?.code||'—'}] ${t.title}</span>
            <span class="assignee">${teamById(t.assignee)?.name||'—'}</span>
            <span class="due over">${fmtShort(t.due)}</span>
            <button class="del" data-del="${t.id}">×</button>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <h2 class="section-title">Semana</h2>
    <div class="week-grid">
      ${days.map(d=>{
        const iso = toISO(d);
        const dayTasks = state.tasks.filter(t=>t.due===iso).sort((a,b)=> (a.priority<b.priority?1:-1));
        return `<div class="week-col ${iso===ts?'today':''}">
          <div class="whead">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}<b>${d.getDate()}</b></div>
          ${dayTasks.length===0 ? '' : dayTasks.map(t=>`
            <div class="chip p-${t.priority}" data-task="${t.id}">
              <div class="ccode">${contractById(t.contractId)?.code||'—'}</div>

            </div>
          `).join('')}
        </div>`;
      }).join('')}
    </div>
  `;

    <h2 class="section-title" style="margin-top:${pending.length>0?'26px':'0'};">Medição de ${range.label} (${inMonth.length})</h2>

    ` : `

      </div>
      <button class="btn ghost small" style="margin-top:14px;" data-act="export-measure">⤓ Exportar medição do mês (.csv)</button>
    `}
  `;
}

function renderTeamMonthlyTable(range){
  const done = state.tasks.filter(t=>t.status==='concluido' && t.concludedDate && t.concludedDate>=range.start && t.concludedDate<=range.end);
  if(done.length===0){
    return `<div class="empty"><b>Nenhuma tarefa concluída em ${range.label.toLowerCase()} ainda.</b>O relatório é montado a partir das tarefas marcadas como concluídas no período.</div>`;
  }
  return `<div style="overflow-x:auto;">
    <table class="meas-table">
      <thead><tr><th>Colaborador</th><th>Concluídas</th><th>Horas totais</th><th>Média h/tarefa</th></tr></thead>
      <tbody>
        ${state.team.map(person=>{
          const mine = done.filter(t=>t.assignee===person.id);
          const totalH = mine.reduce((s,t)=> s + (t.horas||0), 0);
          const withH = mine.filter(t=>t.horas!=null).length;
          return `<tr>
            <td>${person.name}</td>
            <td class="mono">${mine.length}</td>
            <td class="mono">${totalH || '—'}</td>
            <td class="mono">${withH? (totalH/withH).toFixed(1) : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

            <div><div class="k">Cliente</div>${c.client||'—'}</div>
            <div><div class="k">Status</div><span class="badge ${c.status}">${STATUS_LABEL[c.status]}</span></div>
            <div><div class="k">Próxima entrega</div>${c.nextDeliverable||'—'} ${c.deliverableDate?'· '+fmtShort(c.deliverableDate):''}</div>
            <div><div class="k">Medição prevista</div>${c.measurementDate?fmtShort(c.measurementDate):'—'}</div>
          </div>
          ${c.notes? `<div style="margin-top:8px;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;">${c.notes}</div>`:''}

          <h2 class="section-title" style="margin-top:20px;">Tarefas (${tasks.length})</h2>
          <div class="task-list">
            ${tasks.length===0 ? `<div class="empty">Nenhuma tarefa lançada para este contrato ainda.</div>` :
              tasks.map(t=>{
                const isOver = t.due && t.due<todayStr() && t.status!=='concluido';
                const showRelease = t.status==='concluido' && tipoContaMedicao(t.tipoProjeto);
                return `<div class="task-row ${t.status==='concluido'?'done':''}" data-task="${t.id}">
                  <div class="chk ${t.status==='concluido'?'done':t.status==='andamento'?'doing':''}" data-toggle="${t.id}"></div>
                  <span class="prio-dot prio-${t.priority}"></span>
                  <span class="ttl" data-edit-task="${t.id}" style="cursor:pointer;">${t.title}${t.tipoProjeto?` <span class="hours-tag">${tipoLabel(t.tipoProjeto)}</span>`:''}</span>
                  ${t.horas!=null?`<span class="hours-tag">${t.horas}h</span>`:''}
                  <span class="assignee">${teamById(t.assignee)?.name||'—'}</span>
                  <span class="due ${isOver?'over':''}">${fmtShort(t.due)}</span>
                  ${showRelease ? (t.revisado
                    ? `<span class="meas-tag done" data-toggle-measure="${t.id}" title="Clique para desfazer">✓ Medição ${fmtShort(t.dataProtocolo)}</span>`
                    : `<button class="btn ghost small" data-toggle-measure="${t.id}" title="Revisar e liberar para medição">📋 Liberar p/ medição</button>`
                  ) : ''}
                  ${t.status==='concluido' && !t.revisado ? `<button class="btn ghost small" data-reopen-task="${t.id}" title="Voltar tarefa para em andamento">↩ Retornar para projeto</button>` : ''}
                  <button class="del" data-del="${t.id}">×</button>
                </div>`;
              }).join('')
            }
          </div>
          <button class="btn ghost small" style="margin-top:12px;" data-act="new-task-for" data-id="${c.id}">+ Tarefa neste contrato</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

/* ---------- EVENTS ---------- */
function attachEvents(){
  document.querySelectorAll('[data-month-nav]').forEach(el=>el.onclick=()=>{
    const [which, v] = el.dataset.monthNav.split(':');
    const key = which==='measure' ? 'measureMonthOffset' : 'teamMonthOffset';
    ui[key] = v==='today' ? 0 : ui[key] + parseInt(v);
    render();
  });

  document.querySelectorAll('[data-week-nav]').forEach(el=>el.onclick=()=>{
    const v = el.dataset.weekNav;
    ui.weekOffset = v==='today' ? 0 : ui.weekOffset + parseInt(v);
    render();
  });

  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ ui.tab=el.dataset.tab; render(); });

  document.querySelectorAll('[data-act="export-backup"]').forEach(el=>el.onclick=()=> exportBackup());
  const fileInput = document.getElementById('import-file-input');
  document.querySelectorAll('[data-act="import-backup"]').forEach(el=>el.onclick=()=> fileInput.click());
  if(fileInput) fileInput.onchange = (e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; };

  document.querySelectorAll('[data-act="new-contract"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'new-contract', data:null}; render(); });
  document.querySelectorAll('[data-act="new-task"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'new-task', data:{}}; render(); });
  document.querySelectorAll('[data-act="new-task-for"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'new-task', data:{contractId: el.dataset.id}}; render(); });

  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ ui.modal={type:'contract-detail', id: el.dataset.open}; render(); });
  document.querySelectorAll('[data-act="open-edit-contract"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'edit-contract', data: contractById(el.dataset.id)}; render(); });

  document.querySelectorAll('[data-act="close-modal"]').forEach(el=>el.onclick=()=>{ ui.modal=null; render(); });
  document.querySelectorAll('[data-close-overlay]').forEach(el=>{
    el.onmousedown = (e)=>{ el._downOnSelf = (e.target===el); };
    el.onclick = (e)=>{ if(e.target===el && el._downOnSelf){ ui.modal=null; render(); } };
  });
  document.querySelectorAll('[data-stop]').forEach(el=>el.onclick=(e)=>e.stopPropagation());

  document.querySelectorAll('[data-act="save-contract"]').forEach(el=>el.onclick=async()=>{
    const id = el.dataset.id;
    const payload = {
      id: id || uid('c'),
      code: document.getElementById('f-code').value.trim() || nextContractCode(),
      name: document.getElementById('f-name').value.trim() || 'Contrato sem nome',
      client: document.getElementById('f-client').value.trim(),
      status: document.getElementById('f-status').value,
      deliverableDate: document.getElementById('f-deliverdate').value,
      nextDeliverable: document.getElementById('f-deliver').value.trim(),
      measurementDate: document.getElementById('f-measure').value,
      notes: document.getElementById('f-notes').value.trim(),
    };
    if(id){
      const idx = state.contracts.findIndex(c=>c.id===id);
      state.contracts[idx] = payload;
    } else {
      state.contracts.push(payload);
    }
    await save();
    ui.modal=null; ui.tab='contracts'; render();
  });

  document.querySelectorAll('[data-act="delete-contract"]').forEach(el=>el.onclick=async()=>{
    const id = el.dataset.id;
    if(!confirm('Excluir este contrato e todas as suas tarefas?')) return;
    state.contracts = state.contracts.filter(c=>c.id!==id);
    state.tasks = state.tasks.filter(t=>t.contractId!==id);
    await save();
    ui.modal=null; render();
  });

  document.querySelectorAll('[data-act="save-task"]').forEach(el=>el.onclick=async()=>{
    const contractId = document.getElementById('f-t-contract').value;
    if(!contractId) return;
    const id = el.dataset.id;
    const fields = {
      contractId,
      title: document.getElementById('f-t-title').value.trim() || 'Tarefa sem título',
      assignee: document.getElementById('f-t-assignee').value,
      due: document.getElementById('f-t-due').value,
      priority: document.getElementById('f-t-priority').value,
      horas: document.getElementById('f-t-horas').value ? parseFloat(document.getElementById('f-t-horas').value) : null,
      tipoProjeto: document.getElementById('f-t-tipo').value || null,
    };
    if(id){
      const existing = state.tasks.find(x=>x.id===id);
      Object.assign(existing, fields);
    } else {
      state.tasks.push({
        id: uid('tk'), ...fields,
        status: 'pendente', concludedDate: null, revisado: false, dataProtocolo: null,
      });
    }
    await save();
    ui.modal=null; render();
  });

  document.querySelectorAll('[data-act="delete-task-modal"]').forEach(el=>el.onclick=async()=>{
    const id = el.dataset.id;
    if(!confirm('Excluir esta tarefa?')) return;
    state.tasks = state.tasks.filter(t=>t.id!==id);
    await save();
    ui.modal=null; render();
  });

  document.querySelectorAll('[data-edit-task]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const t = state.tasks.find(x=>x.id===el.dataset.editTask);
    if(t) { ui.modal={type:'new-task', data:{...t}}; render(); }
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id = el.dataset.toggle;
    const t = state.tasks.find(x=>x.id===id);
    const nextStatus = t.status==='pendente' ? 'andamento' : t.status==='andamento' ? 'concluido' : 'pendente';
    if(nextStatus==='concluido'){
      t.concludedDate = todayStr();
      if(t.horas==null || t.horas===''){
        const h = prompt('Quantas horas essa tarefa levou? (opcional, deixe em branco para pular)', '');
        if(h!==null && h.trim()!==''){
          const parsed = parseFloat(h.replace(',','.'));
          if(!isNaN(parsed)) t.horas = parsed;
        }
      }
    } else {
      t.concludedDate = null;
    }
    t.status = nextStatus;
    await save(); render();
  });

  document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id = el.dataset.del;
    state.tasks = state.tasks.filter(t=>t.id!==id);
    await save(); render();
  });

  document.querySelectorAll('[data-toggle-measure]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id = el.dataset.toggleMeasure;
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return;
    if(t.revisado){
      if(!confirm('Desfazer a liberação para medição desta tarefa?')) return;
      t.revisado = false; t.dataProtocolo = null;
    } else {
      t.revisado = true; t.dataProtocolo = todayStr();
    }
    await save(); render();
  });

  document.querySelectorAll('[data-reopen-task]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id = el.dataset.reopenTask;
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return;
    if(!confirm('Voltar esta tarefa para "em andamento"? Isso limpa a data de conclusão e as horas registradas continuam, mas ela sai da lista de concluídas.')) return;
    t.status = 'andamento';
    t.concludedDate = null;
    t.revisado = false;
    t.dataProtocolo = null;
    await save(); render();
  });

  document.querySelectorAll('[data-protocolo]').forEach(el=>{
    el.onchange = async ()=>{
      const t = state.tasks.find(x=>x.id===el.dataset.protocolo);
      if(t){ t.dataProtocolo = el.value; await save(); render(); }
    };
  });

  document.querySelectorAll('[data-rename]').forEach(el=>{
    el.onchange = async ()=>{
      const p = teamById(el.dataset.rename);
      p.name = el.value.trim() || p.name;
      await save(); render();
    };
  });

  document.querySelectorAll('[data-act="add-person"]').forEach(el=>el.onclick=async()=>{
    const name = prompt('Nome da pessoa:');
    if(!name || !name.trim()) return;
    state.team.push({ id: uid('p'), name: name.trim() });
    await save(); render();
  });

  document.querySelectorAll('[data-remove-person]').forEach(el=>el.onclick=async()=>{
    const id = el.dataset.removePerson;
    const p = teamById(id);
    if(!p) return;
    const assignedCount = state.tasks.filter(t=>t.assignee===id).length;
    const msg = assignedCount>0
      ? `Remover ${p.name}? ${assignedCount} tarefa(s) ficarão sem responsável.`
      : `Remover ${p.name}?`;
    if(!confirm(msg)) return;
    state.tasks.forEach(t=>{ if(t.assignee===id) t.assignee=null; });
    state.team = state.team.filter(x=>x.id!==id);
    await save(); render();
  });

  const emailInput = document.getElementById('f-settings-email');
  if(emailInput) emailInput.onchange = async ()=>{
    state.settings.email = emailInput.value.trim();
    await save();
  };

  document.querySelectorAll('[data-act="export-report"]').forEach(el=>el.onclick=()=> exportWeeklyReport());
  document.querySelectorAll('[data-act="export-measure"]').forEach(el=>el.onclick=()=> exportMeasurement());
  document.querySelectorAll('[data-act="export-team-monthly"]').forEach(el=>el.onclick=()=> exportMonthlyTeamReport());
  document.querySelectorAll('[data-act="send-email-alert"]').forEach(el=>el.onclick=()=> sendEmailAlert());
}

load();
</script>
</body>
</html>
