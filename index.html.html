<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEEE9;
    --paper-alt:#E1E4DD;
    --card:#FBFBF9;
    --ink:#1B2430;
    --ink-soft:#5B6673;
    --teal:#2E6F6E;
    --teal-dark:#1B4645;
    --teal-tint:#DCEAE9;
    --alert:#B23A2E;
    --alert-tint:#F6DEDA;
    --amber:#C4622D;
    --amber-tint:#F5E2D3;
    --success:#3F7D4F;
    --success-tint:#DEEBE1;
    --line:#CBD2CB;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}

  /* HEADER */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:12px;
  }
  header.top .brand{display:flex;flex-direction:column;gap:2px;}
  header.top .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--teal-dark);font-weight:600;
  }
  header.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;}
  .quick-actions{display:flex;gap:8px;}
  button.btn{
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13.5px;
    border:1.5px solid var(--ink);background:var(--white);color:var(--ink);
    padding:9px 14px;border-radius:3px;cursor:pointer;transition:.12s;
    display:inline-flex;align-items:center;gap:6px;
  }
  button.btn:hover{background:var(--ink);color:var(--white);}
  button.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--white);}
  button.btn.primary:hover{background:var(--teal-dark);border-color:var(--teal-dark);}
  button.btn.ghost{border-color:var(--line);color:var(--ink-soft);}
  button.btn.ghost:hover{background:var(--paper-alt);color:var(--ink);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn.danger:hover{background:var(--alert);border-color:var(--alert);}

  /* TABS */
  nav.tabs{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  nav.tabs button{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;
    background:none;border:none;padding:10px 4px;margin-right:22px;
    color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;
    position:relative;top:1px;
  }
  nav.tabs button .n{color:var(--teal-dark);margin-right:6px;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--teal);}

  /* WEEK RULER (signature element) */
  .ruler{
    display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;
    margin-bottom:22px;background:var(--card);
  }
  .ruler .day{
    flex:1;min-width:0;padding:10px 8px 12px;border-right:1px solid var(--line);
    position:relative;
  }
  .ruler .day:last-child{border-right:none;}
  .ruler .day.today{background:var(--teal-tint);}
  .ruler .day .dname{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .ruler .day.today .dname{color:var(--teal-dark);font-weight:700;}
  .ruler .day .dnum{font-size:19px;font-weight:700;margin-top:1px;}
  .ruler .day .tick{
    margin-top:8px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;
    display:flex;
  }
  .ruler .day .tick .fill{height:100%;background:var(--amber);}
  .ruler .day .tick .fill.over{background:var(--alert);}
  .ruler .day .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:5px;}

  /* SECTION HEADINGS */
  h2.section-title{
    font-size:13px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-soft);margin:26px 0 12px;
    display:flex;align-items:center;gap:10px;
  }
  h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  /* STAT ROW */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px;}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:5px;padding:14px 16px;
  }
  .stat .val{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .stat.alert .val{color:var(--alert);}
  .stat.amber .val{color:var(--amber);}
  .stat.teal .val{color:var(--teal);}

  /* ALERT LIST */
  .alert-item{
    display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--line);border-left:4px solid var(--alert);
    border-radius:0 4px 4px 0;padding:10px 14px;margin-bottom:8px;
  }
  .alert-item.warn{border-left-color:var(--amber);}
  .alert-item .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--white);
    background:var(--teal);padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap;}
  .alert-item .txt{flex:1;font-size:13.5px;}
  .alert-item .txt b{font-weight:600;}
  .alert-item .due{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--alert);white-space:nowrap;}
  .alert-item.warn .due{color:var(--amber);}
  .empty{
    border:1.5px dashed var(--line);border-radius:6px;padding:26px 20px;text-align:center;
    color:var(--ink-soft);font-size:13.5px;
  }
  .empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px;}

  /* CONTRACT CARDS */
  .contracts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .contract-card{
    background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
    cursor:pointer;transition:.12s;position:relative;
  }
  .contract-card:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(27,36,48,.06);}
  .contract-card .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-dark);font-weight:700;}
  .contract-card h3{margin:4px 0 2px;font-size:15.5px;}
  .contract-card .client{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;
  }
  .badge.andamento{background:var(--teal-tint);color:var(--teal-dark);}
  .badge.aguardando{background:var(--amber-tint);color:var(--amber);}
  .badge.concluido{background:var(--success-tint);color:var(--success);}
  .badge.pausado{background:#E4E4E0;color:var(--ink-soft);}
  .contract-card .meta-row{
    display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;
  }
  .contract-card .next-del{font-size:12.5px;margin-top:2px;}
  .contract-card .next-del b{font-weight:600;}

  /* MODAL / DETAIL PANEL */
  .overlay{
    position:fixed;inset:0;background:rgba(27,36,48,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .panel{
    background:var(--white);border-radius:8px;max-width:620px;width:100%;
    border:1px solid var(--line);box-shadow:0 12px 40px rgba(27,36,48,.2);
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h3{margin:0;font-size:16.5px;}
  .panel-body{padding:18px 20px;}
  .panel-body label{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);margin:12px 0 5px;
  }
  .panel-body label:first-child{margin-top:0;}
  .panel-body input, .panel-body select, .panel-body textarea{
    width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;padding:8px 10px;
    border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);
  }
  .panel-body textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .panel-foot{
    padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;
  }
  .iconbtn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);line-height:1;}
  .iconbtn:hover{color:var(--ink);}

  /* CONTRACT DETAIL */
  .detail-info{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px;margin-bottom:6px;}
  .detail-info .k{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  .task-list{margin-top:10px;}
  .task-row{
    display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--paper-alt);
  }
  .task-row .chk{
    width:18px;height:18px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--white);
  }
  .task-row .chk.done{background:var(--success);border-color:var(--success);}
  .task-row .chk.doing{border-color:var(--amber);}
  .task-row .ttl{flex:1;font-size:13.5px;}
  .task-row.done .ttl{text-decoration:line-through;color:var(--ink-soft);}
  .task-row .assignee{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--paper-alt);
    padding:2px 6px;border-radius:3px;color:var(--ink-soft);white-space:nowrap;
  }
  .task-row .due{font-family:'IBM Plex Mono',monospace;font-size:11.5px;white-space:nowrap;}
  .task-row .due.over{color:var(--alert);font-weight:600;}
  .task-row .del{color:var(--ink-soft);background:none;border:none;cursor:pointer;font-size:15px;}
  .task-row .del:hover{color:var(--alert);}
  .prio-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .prio-alta{background:var(--alert);} .prio-media{background:var(--amber);} .prio-baixa{background:var(--success);}

  /* WEEK VIEW */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .week-col{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:140px;}
  .week-col.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}
  .week-col .whead{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;
  }
  .week-col .whead b{display:block;font-size:15px;color:var(--ink);font-family:'IBM Plex Sans';}
  .chip{
    background:var(--paper-alt);border-radius:4px;padding:6px 8px;margin-bottom:6px;font-size:12px;
    border-left:3px solid var(--teal);cursor:pointer;
  }
  .chip.p-alta{border-left-color:var(--alert);}
  .chip.p-media{border-left-color:var(--amber);}
  .chip.p-baixa{border-left-color:var(--success);}
  .chip .ccode{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--teal-dark);font-weight:700;}
  .chip .cttl{margin-top:2px;}
  .chip .cass{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .overdue-banner{
    background:var(--alert-tint);border:1px solid var(--alert);border-radius:6px;padding:12px 14px;margin-bottom:16px;
  }
  .overdue-banner .title{font-weight:700;color:var(--alert);font-size:13px;margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}

  /* TEAM VIEW */
  .team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .team-col{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;}
  .team-col .thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .team-col .thead input{
    font-size:15px;font-weight:700;border:none;background:none;padding:2px 0;width:70%;
    border-bottom:1px dashed transparent;
  }
  .team-col .thead input:focus{outline:none;border-bottom-color:var(--teal);}
  .team-col .thead .load{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--teal-tint);color:var(--teal-dark);
    padding:2px 7px;border-radius:10px;font-weight:700;
  }

  select.status-select{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 6px;border-radius:3px;border:1px solid var(--line);}

  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .week-grid{grid-template-columns:repeat(1,1fr);}
    .team-grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .detail-info{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'sw-data-v1';
const DAY_MS = 86400000;
const STATUS_LABEL = {andamento:'Em andamento', aguardando:'Aguardando', concluido:'Concluído', pausado:'Pausado'};
const PRIO_LABEL = {alta:'Alta', media:'Média', baixa:'Baixa'};

let state = { contracts: [], tasks: [], team: [
  {id:'t1', name:'Pessoa 1'}, {id:'t2', name:'Pessoa 2'}, {id:'t3', name:'Pessoa 3'}
]};
let ui = { tab:'overview', openContract:null, modal:null, loaded:false };

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function todayStr(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function parseDate(s){ if(!s) return null; const d = new Date(s+'T00:00:00'); return d; }
function fmtShort(s){ if(!s) return '—'; const d=parseDate(s); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function daysDiff(dateStr){ const d=parseDate(dateStr); const t=parseDate(todayStr()); return Math.round((d-t)/DAY_MS); }
function nextContractCode(){
  const nums = state.contracts.map(c=>parseInt((c.code||'SAN-00').split('-')[1])||0);
  const n = (nums.length? Math.max(...nums):0)+1;
  return 'SAN-' + String(n).padStart(2,'0');
}

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ /* primeiro uso, ainda sem dados salvos */ }
  ui.loaded = true;
  render();
}
async function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Erro ao salvar', e); alert('Não foi possível salvar. Verifique o espaço do navegador.'); }
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url; a.download = `painel-semanal-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.contracts || !parsed.tasks || !parsed.team) throw new Error('formato inválido');
      if(!confirm('Isso vai substituir todos os dados atuais pelo backup importado. Continuar?')) return;
      state = parsed;
      await save();
      ui.modal = null;
      render();
    }catch(err){
      alert('Arquivo de backup inválido ou corrompido.');
    }
  };
  reader.readAsText(file);
}

function weekDates(offset=0){
  const t = parseDate(todayStr());
  const dow = (t.getDay()+6)%7; // 0=Mon
  const monday = new Date(t.getTime() - dow*DAY_MS + offset*7*DAY_MS);
  return Array.from({length:7}, (_,i)=> new Date(monday.getTime()+i*DAY_MS));
}
function toISO(d){ return d.toISOString().slice(0,10); }

function openTasksFor(contractId){
  return state.tasks.filter(t=>t.contractId===contractId);
}
function contractById(id){ return state.contracts.find(c=>c.id===id); }
function teamById(id){ return state.team.find(t=>t.id===id); }

function overdueTasks(){
  const ts = todayStr();
  return state.tasks.filter(t=>t.status!=='concluido' && t.due && t.due < ts)
    .sort((a,b)=> a.due<b.due?-1:1);
}
function upcomingDeliverables(days=7){
  const ts = todayStr();
  return state.contracts.filter(c=>c.deliverableDate && c.status!=='concluido')
    .map(c=>({...c, diff: daysDiff(c.deliverableDate)}))
    .filter(c=> c.diff!==null && c.diff>=0 && c.diff<=days)
    .sort((a,b)=>a.diff-b.diff);
}
function upcomingMeasurements(days=7){
  const ts = todayStr();
  return state.contracts.filter(c=>c.measurementDate)
    .map(c=>({...c, diff: daysDiff(c.measurementDate)}))
    .filter(c=> c.diff!==null && c.diff>=0 && c.diff<=days)
    .sort((a,b)=>a.diff-b.diff);
}

/* ---------- RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  if(!ui.loaded){ app.innerHTML = '<div style="padding:60px;text-align:center;color:#5B6673;">Carregando painel…</div>'; return; }

  app.innerHTML = `
    ${renderHeader()}
    ${renderTabs()}
    ${ui.tab==='overview' ? renderOverview() : ''}
    ${ui.tab==='contracts' ? renderContracts() : ''}
    ${ui.tab==='week' ? renderWeek() : ''}
    ${ui.tab==='team' ? renderTeam() : ''}
    ${ui.modal ? renderModal() : ''}
  `;
  attachEvents();
}

function renderHeader(){
  return `
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Gestão de contratos · Saneamento</span>
      <h1>Painel Semanal</h1>
    </div>
    <div class="quick-actions">
      <button class="btn ghost small" data-act="export-backup" title="Baixar backup em .json">⤓ Backup</button>
      <button class="btn ghost small" data-act="import-backup" title="Restaurar de um backup .json">⤒ Importar</button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      <button class="btn ghost small" data-act="new-contract">+ Contrato</button>
      <button class="btn primary small" data-act="new-task">+ Tarefa</button>
    </div>
  </header>`;
}

function renderTabs(){
  const tabs = [
    ['overview','01','Visão geral'],
    ['contracts','02','Contratos'],
    ['week','03','Semana'],
    ['team','04','Equipe'],
  ];
  return `<nav class="tabs">${tabs.map(([id,n,label])=>
    `<button class="${ui.tab===id?'active':''}" data-tab="${id}"><span class="n">${n}</span>${label}</button>`
  ).join('')}</nav>`;
}

function renderRuler(){
  const days = weekDates(0);
  const ts = todayStr();
  return `<div class="ruler">${days.map(d=>{
    const iso = toISO(d);
    const isToday = iso===ts;
    const dayTasks = state.tasks.filter(t=>t.due===iso);
    const overCount = dayTasks.filter(t=>t.status!=='concluido' && iso<ts).length;
    const total = dayTasks.length;
    const fillPct = total? Math.min(100, total*22) : 0;
    return `<div class="day ${isToday?'today':''}">
      <div class="dname">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</div>
      <div class="dnum">${d.getDate()}</div>
      <div class="tick"><div class="fill ${overCount?'over':''}" style="width:${fillPct}%"></div></div>
      <div class="count">${total} tarefa${total===1?'':'s'}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderOverview(){
  const overdue = overdueTasks();
  const ts = todayStr();
  const dueThisWeek = state.tasks.filter(t=>t.status!=='concluido' && t.due && t.due>=ts && daysDiff(t.due)<=7);
  const deliveries = upcomingDeliverables(7);
  const measurements = upcomingMeasurements(7);
  const activeContracts = state.contracts.filter(c=>c.status==='andamento').length;

  const alertItems = [
    ...overdue.map(t=>({kind:'alert', code: contractById(t.contractId)?.code || '—', text:`<b>${t.title}</b> — ${teamById(t.assignee)?.name||'sem responsável'}`, due:`${Math.abs(daysDiff(t.due))}d atrasada`})),
    ...deliveries.map(c=>({kind:'warn', code:c.code, text:`Entrega: <b>${c.nextDeliverable||'entrega'}</b>`, due: c.diff===0?'hoje':`em ${c.diff}d`})),
    ...measurements.map(c=>({kind:'warn', code:c.code, text:`Medição prevista`, due: c.diff===0?'hoje':`em ${c.diff}d`})),
  ];

  return `
    <h2 class="section-title">Esta semana</h2>
    ${renderRuler()}

    <div class="stats">
      <div class="stat teal"><div class="val">${activeContracts}</div><div class="lbl">Contratos em andamento</div></div>
      <div class="stat alert"><div class="val">${overdue.length}</div><div class="lbl">Tarefas atrasadas</div></div>
      <div class="stat amber"><div class="val">${dueThisWeek.length}</div><div class="lbl">Tarefas até 7 dias</div></div>
      <div class="stat"><div class="val">${measurements.length}</div><div class="lbl">Medições próximas</div></div>
    </div>

    <h2 class="section-title">Alertas</h2>
    ${alertItems.length===0 ? `
      <div class="empty"><b>Nada pendente no radar.</b>Sem atrasos ou prazos próximos. Bom momento para planejar a semana seguinte.</div>
    ` : alertItems.map(a=>`
      <div class="alert-item ${a.kind==='warn'?'warn':''}">
        <span class="code">${a.code}</span>
        <span class="txt">${a.text}</span>
        <span class="due">${a.due}</span>
      </div>
    `).join('')}
  `;
}

function renderContracts(){
  if(state.contracts.length===0){
    return `<h2 class="section-title">Contratos</h2>
      <div class="empty"><b>Nenhum contrato cadastrado ainda.</b>Clique em "+ Contrato" para lançar o primeiro e começar a organizar as entregas.</div>`;
  }
  return `
    <h2 class="section-title">Contratos (${state.contracts.length})</h2>
    <div class="contracts-grid">
      ${state.contracts.map(c=>{
        const tasks = openTasksFor(c.id);
        const openCount = tasks.filter(t=>t.status!=='concluido').length;
        const diff = c.deliverableDate ? daysDiff(c.deliverableDate) : null;
        return `<div class="contract-card" data-open="${c.id}">
          <span class="code">${c.code}</span>
          <h3>${c.name}</h3>
          <div class="client">${c.client||'—'}</div>
          <span class="badge ${c.status}">${STATUS_LABEL[c.status]}</span>
          ${c.nextDeliverable ? `<div class="next-del">Próxima entrega: <b>${c.nextDeliverable}</b>${c.deliverableDate ? ' · '+fmtShort(c.deliverableDate)+(diff!==null?` (${diff<0?'atrasada':diff===0?'hoje':diff+'d'})`:'') : ''}</div>` : ''}
          <div class="meta-row">
            <span>${openCount} tarefa${openCount===1?'':'s'} aberta${openCount===1?'':'s'}</span>
            <span>${tasks.length} total</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderWeek(){
  const days = weekDates(0);
  const ts = todayStr();
  const overdue = overdueTasks();
  return `
    ${overdue.length? `
      <div class="overdue-banner">
        <div class="title">Atrasadas (${overdue.length})</div>
        ${overdue.map(t=>`
          <div class="task-row" data-task="${t.id}">
            <div class="chk ${t.status==='concluido'?'done':t.status==='andamento'?'doing':''}" data-toggle="${t.id}"></div>
            <span class="prio-dot prio-${t.priority}"></span>
            <span class="ttl">[${contractById(t.contractId)?.code||'—'}] ${t.title}</span>
            <span class="assignee">${teamById(t.assignee)?.name||'—'}</span>
            <span class="due over">${fmtShort(t.due)}</span>
            <button class="del" data-del="${t.id}">×</button>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <h2 class="section-title">Semana</h2>
    <div class="week-grid">
      ${days.map(d=>{
        const iso = toISO(d);
        const dayTasks = state.tasks.filter(t=>t.due===iso).sort((a,b)=> (a.priority<b.priority?1:-1));
        return `<div class="week-col ${iso===ts?'today':''}">
          <div class="whead">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}<b>${d.getDate()}</b></div>
          ${dayTasks.length===0 ? '' : dayTasks.map(t=>`
            <div class="chip p-${t.priority}" data-task="${t.id}">
              <div class="ccode">${contractById(t.contractId)?.code||'—'}</div>
              <div class="cttl" style="${t.status==='concluido'?'text-decoration:line-through;color:var(--ink-soft);':''}">${t.title}</div>
              <div class="cass">${teamById(t.assignee)?.name||'—'}</div>
            </div>
          `).join('')}
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderTeam(){
  return `
    <h2 class="section-title">Equipe</h2>
    <div class="team-grid">
      ${state.team.map(person=>{
        const tasks = state.tasks.filter(t=>t.assignee===person.id && t.status!=='concluido')
          .sort((a,b)=> (a.due||'9999')<(b.due||'9999')?-1:1);
        return `<div class="team-col">
          <div class="thead">
            <input value="${person.name}" data-rename="${person.id}">
            <span class="load">${tasks.length}</span>
          </div>
          ${tasks.length===0 ? `<div class="empty" style="padding:16px 10px;">Sem tarefas abertas.</div>` :
            tasks.map(t=>{
              const isOver = t.due && t.due<todayStr();
              return `<div class="task-row" data-task="${t.id}">
                <div class="chk ${t.status==='andamento'?'doing':''}" data-toggle="${t.id}"></div>
                <span class="prio-dot prio-${t.priority}"></span>
                <span class="ttl">[${contractById(t.contractId)?.code||'—'}] ${t.title}</span>
                <span class="due ${isOver?'over':''}">${fmtShort(t.due)}</span>
              </div>`;
            }).join('')
          }
        </div>`;
      }).join('')}
    </div>
  `;
}

/* ---------- MODALS ---------- */
function renderModal(){
  if(ui.modal.type==='new-contract' || ui.modal.type==='edit-contract'){
    const c = ui.modal.data || {};
    return `<div class="overlay" data-close-overlay="1">
      <div class="panel" data-stop="1">
        <div class="panel-head">
          <h3>${ui.modal.type==='new-contract'?'Novo contrato':'Editar contrato'}</h3>
          <button class="iconbtn" data-act="close-modal">×</button>
        </div>
        <div class="panel-body">
          <label>Código</label>
          <input id="f-code" value="${c.code||nextContractCode()}" class="mono">
          <label>Nome do contrato</label>
          <input id="f-name" value="${c.name||''}" placeholder="Ex.: Ampliação ETE Zona Norte">
          <label>Cliente</label>
          <input id="f-client" value="${c.client||''}" placeholder="Ex.: Prefeitura de...">
          <div class="row2">
            <div>
              <label>Status</label>
              <select id="f-status">
                ${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Data da próxima entrega</label>
              <input type="date" id="f-deliverdate" value="${c.deliverableDate||''}">
            </div>
          </div>
          <label>Próxima entrega (descrição)</label>
          <input id="f-deliver" value="${c.nextDeliverable||''}" placeholder="Ex.: Relatório de qualidade, medição 04">
          <label>Data de medição prevista</label>
          <input type="date" id="f-measure" value="${c.measurementDate||''}">
          <label>Observações</label>
          <textarea id="f-notes" placeholder="Pendências, pontos de atenção, contatos-chave...">${c.notes||''}</textarea>
        </div>
        <div class="panel-foot">
          ${ui.modal.type==='edit-contract' ? `<button class="btn danger" data-act="delete-contract" data-id="${c.id}">Excluir contrato</button>` : `<span></span>`}
          <button class="btn primary" data-act="save-contract" data-id="${c.id||''}">Salvar</button>
        </div>
      </div>
    </div>`;
  }
  if(ui.modal.type==='new-task'){
    const t = ui.modal.data || {};
    return `<div class="overlay" data-close-overlay="1">
      <div class="panel" data-stop="1">
        <div class="panel-head">
          <h3>Nova tarefa</h3>
          <button class="iconbtn" data-act="close-modal">×</button>
        </div>
        <div class="panel-body">
          <label>Contrato</label>
          <select id="f-t-contract">
            ${state.contracts.length===0 ? `<option value="">Cadastre um contrato primeiro</option>` :
              state.contracts.map(c=>`<option value="${c.id}" ${t.contractId===c.id?'selected':''}>${c.code} — ${c.name}</option>`).join('')}
          </select>
          <label>Título da tarefa</label>
          <input id="f-t-title" value="${t.title||''}" placeholder="Ex.: Enviar laudo de qualidade">
          <div class="row2">
            <div>
              <label>Responsável</label>
              <select id="f-t-assignee">
                ${state.team.map(p=>`<option value="${p.id}" ${t.assignee===p.id?'selected':''}>${p.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Prazo</label>
              <input type="date" id="f-t-due" value="${t.due||todayStr()}">
            </div>
          </div>
          <label>Prioridade</label>
          <select id="f-t-priority">
            ${Object.entries(PRIO_LABEL).map(([k,v])=>`<option value="${k}" ${(t.priority||'media')===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="panel-foot">
          <span></span>
          <button class="btn primary" data-act="save-task" ${state.contracts.length===0?'disabled':''}>Salvar</button>
        </div>
      </div>
    </div>`;
  }
  if(ui.modal.type==='contract-detail'){
    const c = contractById(ui.modal.id);
    if(!c) return '';
    const tasks = openTasksFor(c.id).sort((a,b)=> (a.due||'9999')<(b.due||'9999')?-1:1);
    return `<div class="overlay" data-close-overlay="1">
      <div class="panel" style="max-width:680px;" data-stop="1">
        <div class="panel-head">
          <h3><span class="mono" style="color:var(--teal-dark);font-size:12px;">${c.code}</span><br>${c.name}</h3>
          <div style="display:flex;gap:8px;">
            <button class="btn ghost small" data-act="open-edit-contract" data-id="${c.id}">Editar</button>
            <button class="iconbtn" data-act="close-modal">×</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="detail-info">
            <div><div class="k">Cliente</div>${c.client||'—'}</div>
            <div><div class="k">Status</div><span class="badge ${c.status}">${STATUS_LABEL[c.status]}</span></div>
            <div><div class="k">Próxima entrega</div>${c.nextDeliverable||'—'} ${c.deliverableDate?'· '+fmtShort(c.deliverableDate):''}</div>
            <div><div class="k">Medição prevista</div>${c.measurementDate?fmtShort(c.measurementDate):'—'}</div>
          </div>
          ${c.notes? `<div style="margin-top:8px;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;">${c.notes}</div>`:''}

          <h2 class="section-title" style="margin-top:20px;">Tarefas (${tasks.length})</h2>
          <div class="task-list">
            ${tasks.length===0 ? `<div class="empty">Nenhuma tarefa lançada para este contrato ainda.</div>` :
              tasks.map(t=>{
                const isOver = t.due && t.due<todayStr() && t.status!=='concluido';
                return `<div class="task-row ${t.status==='concluido'?'done':''}" data-task="${t.id}">
                  <div class="chk ${t.status==='concluido'?'done':t.status==='andamento'?'doing':''}" data-toggle="${t.id}"></div>
                  <span class="prio-dot prio-${t.priority}"></span>
                  <span class="ttl">${t.title}</span>
                  <span class="assignee">${teamById(t.assignee)?.name||'—'}</span>
                  <span class="due ${isOver?'over':''}">${fmtShort(t.due)}</span>
                  <button class="del" data-del="${t.id}">×</button>
                </div>`;
              }).join('')
            }
          </div>
          <button class="btn ghost small" style="margin-top:12px;" data-act="new-task-for" data-id="${c.id}">+ Tarefa neste contrato</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

/* ---------- EVENTS ---------- */
function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{ ui.tab=el.dataset.tab; render(); });

  document.querySelectorAll('[data-act="export-backup"]').forEach(el=>el.onclick=()=> exportBackup());
  const fileInput = document.getElementById('import-file-input');
  document.querySelectorAll('[data-act="import-backup"]').forEach(el=>el.onclick=()=> fileInput.click());
  if(fileInput) fileInput.onchange = (e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; };

  document.querySelectorAll('[data-act="new-contract"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'new-contract', data:null}; render(); });
  document.querySelectorAll('[data-act="new-task"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'new-task', data:{}}; render(); });
  document.querySelectorAll('[data-act="new-task-for"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'new-task', data:{contractId: el.dataset.id}}; render(); });

  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ ui.modal={type:'contract-detail', id: el.dataset.open}; render(); });
  document.querySelectorAll('[data-act="open-edit-contract"]').forEach(el=>el.onclick=()=>{ ui.modal={type:'edit-contract', data: contractById(el.dataset.id)}; render(); });

  document.querySelectorAll('[data-act="close-modal"]').forEach(el=>el.onclick=()=>{ ui.modal=null; render(); });
  document.querySelectorAll('[data-close-overlay]').forEach(el=>el.onclick=(e)=>{ if(e.target===el){ ui.modal=null; render(); } });
  document.querySelectorAll('[data-stop]').forEach(el=>el.onclick=(e)=>e.stopPropagation());

  document.querySelectorAll('[data-act="save-contract"]').forEach(el=>el.onclick=async()=>{
    const id = el.dataset.id;
    const payload = {
      id: id || uid('c'),
      code: document.getElementById('f-code').value.trim() || nextContractCode(),
      name: document.getElementById('f-name').value.trim() || 'Contrato sem nome',
      client: document.getElementById('f-client').value.trim(),
      status: document.getElementById('f-status').value,
      deliverableDate: document.getElementById('f-deliverdate').value,
      nextDeliverable: document.getElementById('f-deliver').value.trim(),
      measurementDate: document.getElementById('f-measure').value,
      notes: document.getElementById('f-notes').value.trim(),
    };
    if(id){
      const idx = state.contracts.findIndex(c=>c.id===id);
      state.contracts[idx] = payload;
    } else {
      state.contracts.push(payload);
    }
    await save();
    ui.modal=null; ui.tab='contracts'; render();
  });

  document.querySelectorAll('[data-act="delete-contract"]').forEach(el=>el.onclick=async()=>{
    const id = el.dataset.id;
    if(!confirm('Excluir este contrato e todas as suas tarefas?')) return;
    state.contracts = state.contracts.filter(c=>c.id!==id);
    state.tasks = state.tasks.filter(t=>t.contractId!==id);
    await save();
    ui.modal=null; render();
  });

  document.querySelectorAll('[data-act="save-task"]').forEach(el=>el.onclick=async()=>{
    const contractId = document.getElementById('f-t-contract').value;
    if(!contractId) return;
    const payload = {
      id: uid('tk'),
      contractId,
      title: document.getElementById('f-t-title').value.trim() || 'Tarefa sem título',
      assignee: document.getElementById('f-t-assignee').value,
      due: document.getElementById('f-t-due').value,
      priority: document.getElementById('f-t-priority').value,
      status: 'pendente',
    };
    state.tasks.push(payload);
    await save();
    ui.modal=null; render();
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id = el.dataset.toggle;
    const t = state.tasks.find(x=>x.id===id);
    t.status = t.status==='pendente' ? 'andamento' : t.status==='andamento' ? 'concluido' : 'pendente';
    await save(); render();
  });

  document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const id = el.dataset.del;
    state.tasks = state.tasks.filter(t=>t.id!==id);
    await save(); render();
  });

  document.querySelectorAll('[data-rename]').forEach(el=>{
    el.onchange = async ()=>{
      const p = teamById(el.dataset.rename);
      p.name = el.value.trim() || p.name;
      await save(); render();
    };
  });
}

load();
</script>
</body>
</html>
